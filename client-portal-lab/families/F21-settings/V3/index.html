<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · V3 Card Grid — Nestlancer Portal Lab</title>
<meta name="description" content="F21 variant 3: settings as a grid of topic cards, each opening a detail drawer for account, security, notifications and data.">
<link rel="stylesheet" href="../../../shared/tokens.css">
<link rel="stylesheet" href="../../../shared/base.css">
<script>
(function(){var t=null;try{t=localStorage.getItem('nl-theme')}catch(e){}
var q=new URLSearchParams(location.search);var d=q.get('theme')?q.get('theme')==='dark':(t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches);
document.documentElement.classList.toggle('dark',d);document.documentElement.dataset.theme=d?'dark':'light';})();
</script>
<style>
/* V3 — Card Grid. A grid · B topic-first · D medium · E detail drawer (dialog). */
.page{max-width:1020px;margin:0 auto;padding:0 22px 60px}
.hd{padding:22px 0 14px}
.hd h1{font-size:24px;letter-spacing:-.035em}
.hd p{margin:4px 0 0;font-size:12px;color:var(--muted-foreground)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:11px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:15px 16px;
  text-align:left;display:grid;gap:6px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--brand-300)}
.tile:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.tile .ttl{display:flex;gap:8px;align-items:center}
.tile h2{font-size:13px;letter-spacing:-.015em;flex:1}
.tile .arw{color:var(--muted-foreground);font-size:12px}
.tile p{margin:0;font-size:11.5px;line-height:1.55;color:var(--muted-foreground)}
.tile .sum{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.tile .sum span{font-size:10px;border:1px solid var(--border);border-radius:999px;padding:1px 7px;
  color:var(--muted-foreground);background:var(--background)}
.tile[data-warn="1"]{border-color:#f1d9a9}
.tile[data-warn="1"] .ttl h2::after{content:'!';display:inline-grid;place-items:center;width:14px;height:14px;
  border-radius:50%;background:var(--status-warning-bg);color:var(--status-warning-text);font-size:9px;
  font-weight:800;margin-left:5px}
.dlg{border:1px solid var(--border);border-radius:var(--radius-lg);padding:0;max-width:520px;width:calc(100vw - 36px);
  background:var(--card);color:var(--foreground);box-shadow:0 30px 70px -40px rgba(15,28,46,.65)}
.dlg::backdrop{background:rgba(15,28,46,.42)}
.dh{display:flex;gap:9px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border)}
.dh h2{font-size:13.5px;letter-spacing:-.015em;flex:1}
.dh .x{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--muted-foreground);
  font-size:14px}
.dh .x:hover{background:var(--muted)}
.db{padding:14px 16px;display:grid;gap:11px;max-height:60vh;overflow:auto}
.df{padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:6px;justify-content:flex-end}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;font-size:12px}
.drow b{font-weight:600;display:block}
.drow .m{font-size:10.5px;color:var(--muted-foreground);margin-top:1px;line-height:1.45}
.drow input{font:inherit;font-size:12px;padding:6px 9px;border:1px solid var(--border);border-radius:5px;
  background:var(--card);color:var(--foreground);outline:none;width:190px}
.drow input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--brand-50)}
.dark .drow input:focus{box-shadow:0 0 0 3px #1b2650}
.sw{width:32px;height:18px;border-radius:99px;background:var(--muted);position:relative;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(15,28,46,.3);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--primary)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
@media(prefers-reduced-motion:reduce){.sw::after{transition:none}}
.dnote{font-size:10.5px;line-height:1.6;color:var(--muted-foreground);border-top:1px solid var(--border);
  padding-top:9px}
.end{margin-top:18px;font-size:11px;color:var(--muted-foreground);display:flex;gap:10px;flex-wrap:wrap;
  align-items:center}
.seg{display:inline-flex;gap:2px;margin-left:auto}
.seg a{padding:3px 7px;border-radius:var(--radius-sm);font-weight:600;color:var(--muted-foreground)}
.seg a[aria-current="page"]{background:var(--brand-50);color:var(--brand-700)}
.dark .seg a[aria-current="page"]{background:#1b2650;color:#c9d6ff}
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></symbol>
</svg>
<a class="skip" href="#main">Skip to settings</a>
<div class="shell shell--top">
  <header class="topbar">
    <div class="topbar-in">
      <a class="logo" href="../../F03-dashboard-overview/V1/index.html">Nestlancer</a>
      <nav class="nav" aria-label="Main">
        <a href="../../F03-dashboard-overview/V1/index.html">Overview</a>
        <a href="../../F20-profile/V1/index.html">Profile</a>
        <a href="index.html" aria-current="page">Settings</a>
      </nav>
      <div class="topbar-end">
        <button class="iconbtn" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false">
          <svg class="i"><use href="#i-moon"/></svg><svg class="i"><use href="#i-sun"/></svg></button>
      </div>
    </div>
  </header>

  <main id="main" class="page">
    <div class="hd"><h1>Settings</h1><p>Six topics. Open a card to change it — nothing is buried three levels deep.</p></div>

    <div class="grid">
      <button class="tile" data-open="account">
        <span class="ttl"><h2>Account details</h2><span class="arw" aria-hidden="true">→</span></span>
        <p>Name, email, time zone and verification state.</p>
        <span class="sum"><span>arjun@khandeshspice.example</span><span>verified</span></span></button>

      <button class="tile" data-open="security" data-warn="1">
        <span class="ttl"><h2>Security</h2><span class="arw" aria-hidden="true">→</span></span>
        <p>Password, two-factor and the eight active sessions.</p>
        <span class="sum"><span>2FA off</span><span>8 sessions</span><span>changed 12 Aug</span></span></button>

      <button class="tile" data-open="notif">
        <span class="ttl"><h2>Notifications</h2><span class="arw" aria-hidden="true">→</span></span>
        <p>18 switches across email, in-app and push, plus quiet hours.</p>
        <span class="sum"><span>17 on</span><span>quiet 22:00–07:00</span></span></button>

      <button class="tile" data-open="privacy">
        <span class="ttl"><h2>Privacy</h2><span class="arw" aria-hidden="true">→</span></span>
        <p>What a studio can see on your card.</p>
        <span class="sum"><span>studios only</span></span></button>

      <button class="tile" data-open="files">
        <span class="ttl"><h2>Files and documents</h2><span class="arw" aria-hidden="true">→</span></span>
        <p>Uploads, downloads and generated PDFs.</p>
        <span class="sum"><span>own screen</span></span></button>

      <button class="tile" data-open="danger">
        <span class="ttl"><h2>Danger zone</h2><span class="arw" aria-hidden="true">→</span></span>
        <p>Delete your account. Invoices are retained.</p>
        <span class="sum"><span>irreversible</span></span></button>
    </div>

    <dialog class="dlg" data-dlg aria-labelledby="dtitle">
      <div class="dh"><h2 id="dtitle" data-dtitle>Settings</h2>
        <button class="x" data-close aria-label="Close">✕</button></div>
      <div class="db" data-dbody></div>
      <div class="df"><button class="btn btn-g btn-sm" data-close>Close</button>
        <button class="btn btn-p btn-sm" data-dsave>Save</button></div>
    </dialog>

    <div class="end">
      <a href="../../../index.html">← Gallery</a><span>F21 · V3 of 5</span>
      <span class="seg"><a href="../V1/index.html">V1</a><a href="../V2/index.html">V2</a><a href="index.html" aria-current="page">V3</a><a href="../V4/index.html">V4</a><a href="../V5/index.html">V5</a></span>
    </div>
  </main>
</div>
<div class="toast" role="status" aria-live="polite" data-toast></div>
<script>
(function(){
  'use strict';
  var root=document.documentElement, toast=document.querySelector('[data-toast]'), tm;
  function say(m){toast.textContent=m;toast.dataset.show='true';clearTimeout(tm);tm=setTimeout(function(){toast.dataset.show='false';},2600);}
  var tt=document.querySelector('[data-theme-toggle]');
  function sync(){var d=root.classList.contains('dark');root.dataset.theme=d?'dark':'light';
    tt.setAttribute('aria-pressed',String(d));tt.setAttribute('aria-label',d?'Switch to light theme':'Switch to dark theme');}
  sync();
  tt.addEventListener('click',function(){var d=!root.classList.contains('dark');
    root.classList.toggle('dark',d);try{localStorage.setItem('nl-theme',d?'dark':'light');}catch(e){}sync();});

  var dlg=document.querySelector('[data-dlg]'), body=document.querySelector('[data-dbody]'),
      title=document.querySelector('[data-dtitle]'), lastFocus=null, current='';

  function row(b, m, ctrl){
    var d=document.createElement('div'); d.className='drow';
    var l=document.createElement('div');
    var bb=document.createElement('b'); bb.textContent=b; l.appendChild(bb);
    if(m){var mm=document.createElement('p'); mm.className='m'; mm.textContent=m; l.appendChild(mm);}
    d.appendChild(l); d.appendChild(ctrl); return d;
  }
  function toggle(label,on){
    var sw=document.createElement('button'); sw.className='sw'; sw.setAttribute('role','switch');
    sw.setAttribute('aria-checked',String(on)); sw.setAttribute('aria-label',label);
    sw.addEventListener('click',function(){
      var v=sw.getAttribute('aria-checked')!=='true';
      sw.setAttribute('aria-checked',String(v)); say(label+(v?' on':' off')+' — saved.');
    });
    return sw;
  }
  function input(id,val,ro){
    var i=document.createElement('input'); i.type='text'; i.value=val; i.id=id;
    i.setAttribute('aria-label',id);
    if(ro){i.readOnly=true;i.style.cssText='background:var(--muted);color:var(--muted-foreground)';}
    return i;
  }

  var content={
    account:{t:'Account details',h:function(){
      body.appendChild(row('Display name','Shown to your studio',input('acc-name','Arjun Mehta')));
      body.appendChild(row('Email','Changing this re-verifies the address',input('acc-mail','arjun@khandeshspice.example')));
      body.appendChild(row('Time zone','All timestamps render in IST',input('acc-tz','Asia/Kolkata (IST)')));
      note('Your name and email also appear on quotes and invoices, so a change here is reflected there.');
    }},
    security:{t:'Security',h:function(){
      body.appendChild(row('Two-factor authentication','Currently off — recommended before adding a bank account',
        toggle('Two-factor authentication',false)));
      body.appendChild(row('SMS backup',null,toggle('SMS backup',false)));
      body.appendChild(row('Password','Last changed 12 Aug 2026',input('sec-pw','••••••••••••',true)));
      body.appendChild(row('Active sessions','7 other devices — revoke anything unfamiliar',toggle('Session alerts',true)));
      var p=document.createElement('p'); p.className='dnote';
      p.textContent='Revoking is immediate. Eight sessions is the current count from GET /users/sessions.';
      body.appendChild(p);
    }},
    notif:{t:'Notifications',h:function(){
      ['Quotes','Payments','Messages','Projects','Requests','Account'].forEach(function(c){
        body.appendChild(row(c,'email · in-app · push',toggle(c+' push',c!=='Requests')));
      });
      var p=document.createElement('p'); p.className='dnote';
      p.textContent='18 switches in total on the full screen; this drawer shows the push column.';
      body.appendChild(p);
    }},
    privacy:{t:'Privacy',h:function(){
      body.appendChild(row('Show email to studios','Otherwise messages only',toggle('Show email',true)));
      body.appendChild(row('Show company on card','Khandesh Spice Pvt Ltd',toggle('Show company',true)));
      body.appendChild(row('Discoverable by any studio','Currently studios only',toggle('Discoverable',false)));
    }},
    files:{t:'Files and documents',h:function(){
      var p=document.createElement('p'); p.className='dnote'; p.style.borderTop='0'; p.style.paddingTop='0';
      p.textContent='Files have a dedicated browser with a dropzone, six source tabs and type chips.';
      body.appendChild(p);
      var a=document.createElement('a'); a.className='btn btn-p btn-sm'; a.href='../../F22-settings-files/V1/index.html';
      a.textContent='Open file browser'; a.style.justifySelf='start'; body.appendChild(a);
    }},
    danger:{t:'Danger zone',h:function(){
      body.appendChild(row('Delete account','Access removed immediately; invoices retained',toggle('Confirm deletion',false)));
      var p=document.createElement('p'); p.className='dnote';
      p.textContent='Deletion from the portal requires the confirmation toggle plus an emailed link. Not performed here.';
      body.appendChild(p);
    }}
  };
  function note(t){var p=document.createElement('p');p.className='dnote';p.textContent=t;body.appendChild(p);}

  document.querySelectorAll('[data-open]').forEach(function(t){
    t.addEventListener('click',function(){
      current=t.dataset.open; lastFocus=t;
      body.innerHTML=''; title.textContent=content[current].t; content[current].h();
      document.querySelector('[data-dsave]').style.display=current==='files'?'none':'';
      if(typeof dlg.showModal==='function')dlg.showModal(); else dlg.setAttribute('open','');
      var f=body.querySelector('input,button.sw'); if(f)f.focus();
    });
  });
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.addEventListener('click',function(){
      if(typeof dlg.close==='function')dlg.close(); else dlg.removeAttribute('open');
      if(lastFocus)lastFocus.focus();
    });
  });
  dlg.addEventListener('close',function(){if(lastFocus)lastFocus.focus();});
  document.querySelector('[data-dsave]').addEventListener('click',function(){
    say(content[current].t+' saved.');
    if(typeof dlg.close==='function')dlg.close(); else dlg.removeAttribute('open');
  });
})();
</script>
</body>
</html>
